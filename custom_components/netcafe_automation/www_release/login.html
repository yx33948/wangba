<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录控制台</title><style>*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a1220;
  --surface:rgba(255,255,255,.96);
  --text:#132238;
  --muted:#667892;
  --line:rgba(22,45,74,.12);
  --blue:#2563eb;
  --teal:#0f8f8c;
  --red:#c54242;
  --shadow:0 32px 72px rgba(3,10,24,.28);
}
body{
  min-height:100vh;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top right, rgba(37,99,235,.22), transparent 28%),
    radial-gradient(circle at left center, rgba(15,143,140,.18), transparent 34%),
    linear-gradient(180deg,#08101b 0%,#0b1423 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.auth-shell{
  width:min(100%, 980px);
  display:grid;
  grid-template-columns:minmax(320px,420px) minmax(320px,460px);
  gap:24px;
  align-items:stretch;
}
    .auth-aside{
      padding: 40px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #eef6ff;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-visual {
      position: relative;
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .cyber-circle {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(99, 102, 241, 0.2);
      border-radius: 50%;
      animation: rotate 10s linear infinite;
    }
    .cyber-circle::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      width: 10px;
      height: 10px;
      background: #6366f1;
      border-radius: 50%;
      box-shadow: 0 0 15px #6366f1;
    }
    .cyber-circle-inner {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 1px dashed rgba(34, 211, 238, 0.3);
      border-radius: 50%;
      animation: rotate-reverse 15s linear infinite;
    }
    .cyber-core {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
      z-index: 2;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(34, 211, 238, 0.6); }
    }
    .auth-aside h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(to bottom, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .auth-aside p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 280px;
    }
.auth-card{
  padding:28px;
  border-radius:32px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(246,249,252,.98));
  border:1px solid rgba(255,255,255,.82);
  box-shadow:var(--shadow);
}
.auth-card h2{
  font-size:30px;
  font-weight:900;
  letter-spacing:-.04em;
}
.auth-card p{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:20px;
}
.tab{
  min-height:42px;
  border:none;
  border-radius:14px;
  background:rgba(22,45,74,.06);
  color:var(--muted);
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
.tab.active{
  background:linear-gradient(135deg,#0f8f8c,#2563eb);
  color:#fff;
}
.panel{display:none;margin-top:18px;}
.panel.active{display:block;}
.form{
  display:grid;
  gap:12px;
}
.field{
  display:grid;
  gap:6px;
}
.field label{
  font-size:13px;
  font-weight:700;
}
.field input{
  width:100%;
  min-height:46px;
  padding:0 14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#fff;
  font:inherit;
  color:var(--text);
  outline:none;
}
.field input:focus{
  border-color:rgba(37,99,235,.32);
  box-shadow:0 0 0 4px rgba(37,99,235,.08);
}
.actions{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-top:6px;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  padding:0 16px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font:inherit;
  font-weight:800;
}
.btn-primary{
  background:linear-gradient(135deg,#0f8f8c,#2563eb);
  color:#fff;
  box-shadow:0 18px 30px rgba(37,99,235,.18);
}
.btn-secondary{
  background:#fff;
  color:var(--text);
  border:1px solid var(--line);
}
.error{
  min-height:22px;
  margin-top:12px;
  color:var(--red);
  font-size:13px;
  font-weight:700;
}
.note{
  margin-top:14px;
  padding:12px 14px;
  border-radius:16px;
  background:rgba(22,45,74,.05);
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}
@media (max-width:900px){
  .auth-shell{grid-template-columns:1fr;}
}</style></head><body><div class="auth-shell"><aside class="auth-aside"><div class="auth-visual"><div class="cyber-circle"></div><div class="cyber-circle-inner"></div><div class="cyber-core">SMART</div></div><h1>智慧网吧中心</h1><p>智能联控 · 环境监测 · 自动化管理</p></aside><section class="auth-card"><h2>欢迎回来</h2><p>输入用户名密码登录，或者创建一个绑定卡密的新账号。</p><div class="tabs"><button class="tab active" data-tab="login" type="button">登录</button> <button class="tab" data-tab="register" type="button">注册</button></div><div class="panel active" id="panel-login"><form class="form" id="loginForm"><div class="field"><label for="loginUsername">用户名</label> <input id="loginUsername" placeholder="输入用户名" autocomplete="username"></div><div class="field"><label for="loginPassword">密码</label> <input id="loginPassword" type="password" placeholder="输入密码" autocomplete="current-password"></div><div class="actions"><button class="btn btn-primary" id="loginBtn" type="button">登录并进入</button></div></form></div><div class="panel" id="panel-register"><form class="form" id="registerForm"><div class="field"><label for="registerUsername">用户名</label> <input id="registerUsername" placeholder="4-32位字母数字或下划线" autocomplete="username"></div><div class="field"><label for="registerPassword">密码</label> <input id="registerPassword" type="password" placeholder="至少6位密码" autocomplete="new-password"></div><div class="field"><label for="registerEmail">邮箱</label> <input id="registerEmail" type="email" placeholder="可选"></div><div class="field"><label for="registerLicenseKey">卡密</label> <input id="registerLicenseKey" placeholder="输入要绑定的卡密"></div><div class="actions"><button class="btn btn-primary" id="registerBtn" type="button">注册并进入</button></div></form></div><div class="error" id="errorText"></div><div class="note">如果你已经在卡密系统后台创建了前台用户，直接用用户名和密码登录即可。登录令牌会保存在浏览器本地，用于后续访问控制台接口。</div></section></div><script>const STORAGE_KEY = "netcafe_panel_auth_token";
let activeTab = "login";

function nextTarget() {
  const params = new URLSearchParams(window.location.search);
  const next = String(params.get("next") || "/api/netcafe/1.html").trim();
  if (!next.startsWith("/")) return "/api/netcafe/1.html";
  return next;
}

function setError(message = "") {
  document.getElementById("errorText").textContent = String(message || "");
}

function setBusy(busy) {
  document.getElementById("loginBtn").disabled = Boolean(busy);
  document.getElementById("registerBtn").disabled = Boolean(busy);
}

function switchTab(tab) {
  activeTab = tab === "register" ? "register" : "login";
  document.querySelectorAll(".tab").forEach((button) => {
    button.classList.toggle("active", button.dataset.tab === activeTab);
  });
  document.getElementById("panel-login").classList.toggle("active", activeTab === "login");
  document.getElementById("panel-register").classList.toggle("active", activeTab === "register");
  setError("");
}

function storeToken(token) {
  const value = String(token || "").trim();
  if (value) {
    window.localStorage.setItem(STORAGE_KEY, value);
  } else {
    window.localStorage.removeItem(STORAGE_KEY);
  }
}

async function requestAuth(path, payload) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload || {}),
    credentials: "same-origin",
  });
  const data = await response.json().catch(() => null);
  if (!response.ok || !data || data.success === false) {
    throw new Error((data && data.message) || `请求失败: ${response.status}`);
  }
  return data;
}

async function submitLogin(event) {
  event.preventDefault();
  const username = String(document.getElementById("loginUsername").value || "").trim();
  const password = String(document.getElementById("loginPassword").value || "");
  if (!username || !password) {
    setError("请输入用户名和密码。");
    return;
  }
  setBusy(true);
  setError("");
  try {
    const result = await requestAuth("/api/netcafe/panel/auth/login", { username, password });
    const data = result.data || {};
    storeToken(data.token || "");
    window.location.replace(nextTarget());
  } catch (error) {
    setError(error.message || "登录失败。");
  } finally {
    setBusy(false);
  }
}

async function submitRegister(event) {
  event.preventDefault();
  const username = String(document.getElementById("registerUsername").value || "").trim();
  const password = String(document.getElementById("registerPassword").value || "");
  const email = String(document.getElementById("registerEmail").value || "").trim();
  const licenseKey = String(document.getElementById("registerLicenseKey").value || "").trim();
  if (!username || !password || !licenseKey) {
    setError("注册时必须填写用户名、密码和卡密。");
    return;
  }
  setBusy(true);
  setError("");
  try {
    const result = await requestAuth("/api/netcafe/panel/auth/register", {
      username,
      password,
      email,
      license_key: licenseKey,
    });
    const data = result.data || {};
    storeToken(data.token || "");
    window.location.replace(nextTarget());
  } catch (error) {
    setError(error.message || "注册失败。");
  } finally {
    setBusy(false);
  }
}

function bindEvents() {
  document.querySelectorAll(".tab").forEach((button) => {
    button.addEventListener("click", () => switchTab(button.dataset.tab || "login"));
  });
  document.getElementById("loginForm").addEventListener("submit", submitLogin);
  document.getElementById("registerForm").addEventListener("submit", submitRegister);
  document.getElementById("loginBtn").addEventListener("click", (event) => submitLogin(event));
  document.getElementById("registerBtn").addEventListener("click", (event) => submitRegister(event));
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bindEvents, { once: true });
} else {
  bindEvents();
}</script></body></html>
