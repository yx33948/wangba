厢环境与关键告警一屏掌握。</p></div></div></div><div class="title-bar-right"><div class="title-status-cluster"><div class="title-metric-strip"><div class="top-chip top-chip-ambient" onclick="showWeatherForecast()" style="cursor: pointer;"><span class="top-chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 1.5V3M19.5 4.5 18 6M22.5 12H21M19.5 19.5 18 18M12 22.5V21M4.5 19.5 6 18M1.5 12H3M4.5 4.5 6 6M18 12h.5a2.5 2.5 0 0 1 0 5H10a3 3 0 0 1-3-3v-.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="top-chip-copy"><strong id="headerAmbientValue">--</strong> <span id="headerAmbientHumidity">--</span> <small id="headerAmbientWind">--</small></div></div><div class="top-chip top-chip-time"><span class="top-chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><div class="top-chip-copy"><strong class="mono" id="datetime">--</strong> <span id="headerDateText">--</span></div></div></div><div class="title-meta-panel"><div class="title-meta-block"><span class="title-meta-label">运行状态</span><div class="top-status-stack"><span class="badge" id="connectionBadge">未连接</span> <span class="badge" id="licenseBadge">卡密状态未知</span></div></div></div></div><div class="title-action-cluster"><div class="top-user"><div class="top-user-copy"><strong id="headerUserName">管理层</strong> <span id="headerUserRole">超级管理员</span></div><button class="user-chip hidden" id="authUserChip" type="button" onclick="logoutPanelAuth()">未登录</button></div><button class="btn btn-primary title-refresh" type="button" onclick="reloadAll(true)">刷新数据</button></div></div></header><div class="banner" id="licenseBanner"></div><div class="banner" id="messageBox"></div><div class="content"><section class="page active" id="page-dashboard"></section><section class="page" id="page-room"></section><section class="page" id="page-ac"></section><section class="page" id="page-light"></section><section class="page" id="page-fan"></section><section class="page" id="page-settings"></section></div></main></div><div class="status-modal" id="statusModal" onclick="closeStatusModal(event)"><div class="status-modal-card" id="statusModalCard" onclick="event.stopPropagation()"><div class="status-modal-head" id="statusModalHead"><div class="status-modal-head-copy"><span class="status-modal-kicker">Room Device Console</span><h3 id="statusModalTitle">详细状态</h3><p>查看包间设备状态、在线终端和可执行联动操作。</p></div><button class="status-modal-close" type="button" onclick="closeStatusModal()">×</button></div><div id="statusModalBody"></div></div></div><script src="./1.js"></script><script>(function(){function syncDashboardRoomCardState(root){var scope=root&&root.querySelectorAll?root:document;scope.querySelectorAll('.dashboard-suite-card').forEach(function(card){var pills=card.querySelectorAll('.dashboard-suite-pill');var pcPill=pills[1];if(!pcPill)return;var text=(pcPill.textContent||'').replace(/\s+/g,'');var match=text.match(/(\d+)\/(\d+)/);if(!match)return;var onlineCount=Number(match[1]||0);var isOccupied=onlineCount>0;card.classList.toggle('occupied',isOccupied);card.classList.toggle('idle',!isOccupied);var badge=card.querySelector('.dashboard-suite-badge');if(badge){badge.classList.toggle('occupied',isOccupied);badge.classList.toggle('idle',!isOccupied);badge.textContent=isOccupied?'使用中':'空闲';}var visual=card.querySelector('.dashboard-suite-isometric');if(visual){visual.classList.toggle('occupied',isOccupied);visual.classList.toggle('idle',!isOccupied);}});}var observer=new MutationObserver(function(mutations){mutations.forEach(function(mutation){mutation.addedNodes.forEach(function(node){if(node&&node.nodeType===1){syncDashboardRoomCardState(node);}});});syncDashboardRoomCardState(document);});if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){syncDashboardRoomCardState(document);observer.observe(document.body,{childList:true,subtree:true,characterData:true});});}else{syncDashboardRoomCardState(document);observer.observe(document.body,{childList:true,subtree:true,characterData:true});}})();</script><script>(function(){function removeTerminalDetailCard(root){var scope=root&&root.querySelectorAll?root:document;scope.querySelectorAll('section.card').forEach(function(card){var title=card.querySelector('.panel-title');if(title&&title.textContent&&title.textContent.trim()==='终端在线明细'){card.remove();}});}var observer=new MutationObserver(function(mutations){mutations.forEach(function(mutation){mutation.addedNodes.forEach(function(node){if(node&&node.nodeType===1){removeTerminalDetailCard(node);}});});removeTerminalDetailCard(document);});if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){removeTerminalDetailCard(document);observer.observe(document.body,{childList:true,subtree:true});});}else{removeTerminalDetailCard(document);observer.observe(document.body,{childList:true,subtree:true});}})();</script></body></html>
