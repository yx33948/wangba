<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能控制</title>
    <link rel="stylesheet" href="/api/netcafe/subcontrol/assets/subcontrol-app.css">
</head>
<body>
    <div class="remote-container">
        <div class="header">
            <span class="brand">智能控制</span>
            <button id="close-btn" class="close-btn" type="button">×</button>
        </div>
        <div class="status-row">
            <span id="connection-status" class="status">初始化...</span>
        </div>
        <div id="license-panel" class="license-panel hidden">
            <div id="license-message" class="license-message">授权状态由 netcafe_automation 总控决定</div>
        </div>

        <div class="tab-row">
            <button class="tab-btn active" data-tab="ac" type="button">空调</button>
            <button class="tab-btn" data-tab="light" type="button">灯光</button>
        </div>

        <div class="tab-content active" id="ac-panel">
            <div class="controls">
                <div class="device-info">
                    <div id="room-name">正在识别包房...</div>
                    <div id="current-temp">--°C</div>
                    <div id="policy-summary" class="policy-summary"></div>
                </div>

                <div class="row temp-row">
                    <button id="temp-down" class="btn round small" type="button" disabled>-</button>
                    <div class="temp-display">
                        <span id="temperature">--</span><span class="unit">°C</span>
                    </div>
                    <button id="temp-up" class="btn round small" type="button" disabled>+</button>
                </div>

                <div class="row controls-row">
                    <div class="control-group mode-group">
                        <select id="mode-select" class="select-box" disabled>
                            <option value="off">关闭</option>
                        </select>
                    </div>

                    <div class="control-group fan-group">
                        <div class="icon-wrapper">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path>
                                <path d="M12 12c2.5 0 4.5 -2 4.5 -4.5s-2 -4.5 -4.5 -4.5"></path>
                                <path d="M12 12c0 2.5 2 4.5 4.5 4.5s4.5 -2 4.5 -4.5"></path>
                                <path d="M12 12c-2.5 0 -4.5 2 -4.5 4.5s2 4.5 4.5 4.5"></path>
                                <path d="M12 12c0 -2.5 -2 -4.5 -4.5 -4.5s-4.5 2 -4.5 4.5"></path>
                            </svg>
                        </div>
                        <select id="fan-select" class="select-box" disabled>
                            <option value="">不支持风速</option>
                        </select>
                    </div>

                    <div class="control-group swing-group">
                        <div class="icon-wrapper">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 20l-10 -10"></path>
                                <path d="M17 20l-14 -6"></path>
                                <path d="M17 20l-8 -14"></path>
                                <path d="M10 14l5 -5"></path>
                            </svg>
                        </div>
                        <select id="swing-select" class="select-box" disabled>
                            <option value="off">摆动关</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <button id="power-btn" class="btn power" type="button" disabled>开关</button>
                </div>
                <div id="ac-reason" class="reason-box hidden"></div>
            </div>
        </div>

        <div class="tab-content" id="light-panel">
            <div class="controls">
                <div class="device-info">
                    <div id="room-name-light">正在识别包房...</div>
                    <div id="light-count">加载中...</div>
                </div>
                <div id="light-reason" class="reason-box hidden"></div>

                <div class="lights-container" id="lights-container">
                    <div class="light-loading">正在加载灯光设备...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="/api/netcafe/subcontrol/assets/subcontrol-app.js"></script>
</body>
</html>
